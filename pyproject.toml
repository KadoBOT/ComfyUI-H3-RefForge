[project]
name = "ComfyUI-H3-RefForge"
description = "Create, save and combine reusable MiniMax H3 image, video and audio references as RefMod safetensors, tuned for source fidelity per reference token. Fork of ComfyUI-MiniMaxH3Mod."
version = "0.3.2"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = ["torch", "safetensors", "numpy", "Pillow"]

[project.urls]
Repository = "https://github.com/KadoBOT/ComfyUI-H3-RefForge"
Documentation = "https://github.com/KadoBOT/ComfyUI-H3-RefForge#readme"
"Bug Tracker" = "https://github.com/KadoBOT/ComfyUI-H3-RefForge/issues"

[tool.comfy]
# Fill with the exact publisher ID from your Comfy Registry profile before publishing.
PublisherId = "kadobot"
DisplayName = "H3 RefForge"
